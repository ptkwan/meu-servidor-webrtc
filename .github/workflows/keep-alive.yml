name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping do servidor no Render
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 25 \
            "https://meu-servidor-webrtc-ifsp.onrender.com/socket.io/?EIO=4&transport=polling"
